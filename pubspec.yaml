name: carvita
description: "Personal assistant for managing and predicting your vehicle's maintenance needs."
publish_to: 'none'
version: 1.2.1+10

environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.8'

dependencies:
  archive: ^4.0.7
  collection: ^1.19.1
  crypto: ^3.0.6
  equatable: ^2.0.7
  file_picker: ^10.1.9
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_colorpicker: ^1.1.0
  flutter_local_notifications: ^19.2.1
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  intl: any
  package_info_plus: ^8.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5
  quick_actions: ^1.1.0
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.3
  timezone: ^0.10.1
  transparent_image: ^2.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  import_sorter: ^4.6.0
  sqflite_common_ffi: ^2.4.2

flutter:
  generate: true
  uses-material-design: true
